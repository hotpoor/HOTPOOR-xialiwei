<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOTPOOR 记录</title><link rel="stylesheet" href="/editor.css"><script type="module" src="/editor.mjs"></script></head>
<body><div class="workspace">
<aside class="document-sidebar">
<div class="brand"><span class="brand-icon">H</span><strong>HOTPOOR</strong><span class="brand-sub">记录</span></div>
<button id="new-record" type="button" class="new-button">＋ 新建记录</button>
<div class="document-tabs" role="tablist" aria-label="文档类型"><button id="tab-public" role="tab" aria-selected="false" aria-controls="document-list" tabindex="-1">公开 <span id="public-count">0</span></button><button id="tab-encrypted" role="tab" aria-selected="true" aria-controls="document-list">加密 <span id="encrypted-count">0</span></button></div>
<input id="document-search" type="search" aria-label="查找文档" placeholder="搜索文档…"><p id="document-count" class="list-label"></p><div id="document-list" role="tabpanel" aria-labelledby="tab-encrypted"></div>
<details id="settings-panel" hidden><summary>⚙ GitHub 设置</summary><p>hotpoor/HOTPOOR-xialiwei</p><label for="token-path">Access Token 文件位置</label><input id="token-path" type="text" spellcheck="false" autocomplete="off" placeholder="选择本机 Token 文件"><small>填写文件路径，不是 Token 内容。</small><div class="settings-actions"><button id="choose-token" type="button">选择文件…</button><button id="save-token-path" type="button">保存位置</button></div><p id="settings-status" role="status"></p></details>
</aside>
<main>
<header class="toolbar"><div class="document-location"><span id="mode-badge">加密记录</span><span class="separator">/</span><span id="active-title">载入中</span></div><div class="toolbar-actions"><button id="open-published" type="button">查看网页 ↗</button><button id="save" type="submit" form="editor">保存</button><button id="publish" type="button" class="primary" disabled>发布到 GitHub</button></div></header>
<div class="editor-scroll"><div class="editor-page"><div class="page-heading"><p class="eyebrow">YOUR WORDS, YOUR SPACE</p><h1 id="mode-heading">加密记录</h1><p id="mode-description">正文仅在本机加密，发布时只同步密文。</p></div>
<p id="status" role="status" aria-live="polite">正在载入…</p><div id="empty-state" hidden>这里还没有文档。点击左侧“新建记录”开始。</div>
<form id="editor" autocomplete="off"><label for="title">标题 <span>公开可见</span></label><input id="title" class="title-input" maxlength="120" required placeholder="给这篇记录起个名字"><label for="summary">摘要 <span>公开可见</span></label><input id="summary" maxlength="300" required placeholder="一句简短的说明"><label for="body">正文 <span>支持 Markdown</span></label><textarea id="body" rows="16" spellcheck="false" placeholder="从这里开始写…"></textarea>
<div class="passwords" id="password-section"><div><label for="password">加密口令</label><div class="password-input"><input type="password" id="password" minlength="12" required autocomplete="new-password" spellcheck="false" aria-describedby="password-count"><button type="button" class="password-toggle" data-password-toggle="password" aria-label="显示口令" aria-pressed="false" title="显示口令"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div><small class="password-count" id="password-count">已输入 0 个字符</small><small>至少 12 个字符，建议使用较长、独有的口令。请自行保存，网站无法找回。</small></div><div><label for="confirm">再次输入口令</label><div class="password-input"><input type="password" id="confirm" minlength="12" required autocomplete="new-password" aria-describedby="confirm-count"><button type="button" class="password-toggle" data-password-toggle="confirm" aria-label="显示口令" aria-pressed="false" title="显示口令"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div><small class="password-count" id="confirm-count">已输入 0 个字符</small></div></div>

<div class="editor-actions"><button type="button" id="load-encrypted">解密已保存版本</button><button type="button" id="clear" class="quiet">清空编辑区</button><small id="save-hint">口令只在本机使用</small></div></form>
<section id="publish-panel" hidden><p id="publish-status" role="status" aria-live="polite"></p></section>
<p class="footnote" id="mode-footnote">保存与发布分开进行，你可以先保存，准备好后再发布。</p></div></div>
</main></div></body></html>
